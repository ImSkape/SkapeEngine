name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # -- WINDOWS ------------------------------------
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure CMake — Game
        run: cmake -B build-game -G "Visual Studio 17 2022" -A x64 -DBUILD_EDITOR=OFF

      - name: Build Game Debug
        run: cmake --build build-game --config Debug -- /m

      - name: Run Game Debug headless
        run: build-game\Debug\Game.exe --headless

      - name: Build Game Release
        run: cmake --build build-game --config Release -- /m

      - name: Run Game Release headless
        run: build-game\Release\Game.exe --headless

      - name: Configure CMake — Editor
        run: cmake -B build-editor -G "Visual Studio 17 2022" -A x64 -DBUILD_EDITOR=ON

      - name: Build Editor Debug
        run: cmake --build build-editor --config Debug -- /m

      - name: Run Editor Debug headless
        run: build-editor\Debug\Editor.exe --headless

      - name: Build Editor Release
        run: cmake --build build-editor --config Release -- /m

      - name: Run Editor Release headless
        run: build-editor\Release\Editor.exe --headless

  # -- MAC -------------------------------------
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

# build-mac job
      - name: Configure CMake — Game
        run: |
          cmake -B build-game \
            -G "Xcode" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.14 \
            -DBUILD_EDITOR=OFF

      - name: Build Game Debug
        run: cmake --build build-game --config Debug

      - name: Run Game Debug headless
        run: ./build-game/Debug/Game --headless

      - name: Build Game Release
        run: cmake --build build-game --config Release

      - name: Run Game Release headless
        run: ./build-game/Release/Game --headless

      - name: Configure CMake — Editor
        run: |
          cmake -B build-editor \
            -G "Xcode" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.14 \
            -DBUILD_EDITOR=ON

      - name: Build Editor Debug
        run: cmake --build build-editor --config Debug

      - name: Run Editor Debug headless
        run: ./build-editor/Debug/Editor --headless

      - name: Build Editor Release
        run: cmake --build build-editor --config Release

      - name: Run Editor Release headless
        run: ./build-editor/Release/Editor --headless

  # -- LINUX -------------------------------------------
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libwayland-dev \
            wayland-protocols \
            libxkbcommon-dev \
            pkg-config

      - name: Install virtual display
        run: sudo apt-get install -y xvfb

      - name: Build Game Debug
        run: |
          cmake -B build-game -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_EDITOR=OFF
          cmake --build build-game

      - name: Run Game Debug headless
        run: xvfb-run ./build-game/Game --headless

      - name: Build Game Release
        run: |
          cmake -B build-game-release -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EDITOR=OFF
          cmake --build build-game-release

      - name: Run Game Release headless
        run: xvfb-run ./build-game-release/Game --headless

      - name: Build Editor Debug
        run: |
          cmake -B build-editor -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_EDITOR=ON
          cmake --build build-editor

      - name: Run Editor Debug headless
        run: xvfb-run ./build-editor/Editor --headless

      - name: Build Editor Release
        run: |
          cmake -B build-editor-release -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_EDITOR=ON
          cmake --build build-editor-release

      - name: Run Editor Release headless
        run: xvfb-run ./build-editor-release/Editor --headless